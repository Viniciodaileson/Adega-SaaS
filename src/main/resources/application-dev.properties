# Perfil de desenvolvimento: habilita o console do H2 em http://localhost:8080/h2-console
# Execute com: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
spring.h2.console.enabled=true

# Em desenvolvimento, o DDL automático é conveniente. Em produção, use migrations.
spring.jpa.hibernate.ddl-auto=update
