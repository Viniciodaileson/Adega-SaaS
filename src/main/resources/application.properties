spring.application.name=adega-saas

# Banco de dados. Em produção, sobrescreva as variáveis abaixo (e nunca use a senha vazia).
spring.datasource.url=${ADEGA_DB_URL:jdbc:h2:file:./adega}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${ADEGA_DB_USER:sa}
spring.datasource.password=${ADEGA_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${ADEGA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# O console do H2 só é habilitado no perfil "dev" (application-dev.properties).
# Ele dá acesso total ao banco e nunca deve ser exposto em produção.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Não devolver detalhes internos de erro na resposta HTTP.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Chave de assinatura ES256. Sem configuração explícita, é gerada em adega-jwt.jwk
# na primeira execução e reutilizada nos próximos reinícios. Em produção, prefira
# injetar adega.jwt.chave-jwk por variável de ambiente ou cofre (ADEGA_JWT_CHAVE_JWK).
adega.jwt.emissor=adega-saas
adega.jwt.tempo-vida-minutos=15
adega.jwt.tempo-vida-refresh-dias=7
adega.jwt.arquivo-chave=${ADEGA_JWT_ARQUIVO:adega-jwt.jwk}
adega.jwt.chave-jwk=${ADEGA_JWT_CHAVE_JWK:}

# CORS: origens do front-end separadas por vírgula.
adega.cors.origens=${ADEGA_CORS_ORIGENS:http://localhost:5173,http://127.0.0.1:5173}

# Limpeza diária de refresh tokens expirados/revogados.
adega.refresh.limpeza-cron=0 0 3 * * *

adega.admin.senha=${ADEGA_ADMIN_SENHA:}
